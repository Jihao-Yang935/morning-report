name: 每日产业情报晨报 V2

on:
  schedule:
    - cron: '30 0 * * 1-5'
  workflow_dispatch:

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 生成晨报并推送到微信（V2升级版）
        env:
          COZE_PAT: ${{ secrets.COZE_PAT }}
          COZE_BOT_ID: ${{ secrets.COZE_BOT_ID }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
        run: python generate_report_v2.py

      - name: 上传运行日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-log-${{ github.run_id }}
          path: |
            *.log
          if-no-files-found: ignore
